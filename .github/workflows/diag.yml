name: Diagnose
on:
  push:
    branches: [diag/build-errors]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and capture errors
        run: |
          set +e
          ./gradlew test --continue --console=plain > build.log 2>&1
          code=$?
          {
            grep -E '^(e: |.*FAILED|.*What went wrong|.*Execution failed|> )' build.log | head -60
          } > errs.txt
          msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' errs.txt | cut -c1-6000)
          echo "::error title=GRADLE ERRORS::$msg"
          exit $code
