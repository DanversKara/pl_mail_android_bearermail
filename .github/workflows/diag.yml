name: Diagnose
on:
  push:
    branches: [diag/build-errors]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and capture errors
        run: |
          set +e
          ./gradlew test --continue --console=plain > build.log 2>&1
          code=$?
          {
            grep -E '^(e: |.*Test.*FAILED|.*What went wrong|.*Execution failed for)' build.log | grep -v ' SKIPPED' | head -40; grep -A6 'What went wrong' build.log | head -30
          } > errs.txt
          msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' errs.txt | cut -c1-6000)
          echo "::error title=GRADLE ERRORS::$msg"
          ./gradlew :app:dependencies --configuration fossDebugCompileClasspath --console=plain 2>&1 | grep -i -E "glance|datastore" | sort -u | head -20 > deps.txt
          m2=$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' deps.txt | cut -c1-3000)
          echo "::error title=GLANCE DEPS::$m2"
          grep -E '^e: ' build.log | sed 's#file:///home/runner/work/pl_mail_android_bearermail/pl_mail_android_bearermail/##' | head -12 > e12.txt
          m3=$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' e12.txt | cut -c1-4000)
          echo "::error title=FIRST ERRORS::$m3"
          exit $code
