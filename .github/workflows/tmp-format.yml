name: Temporary format
# Runs spotlessApply on this branch and commits the result. Removed again right after.
on:
    push:
        branches: [feature/notes]
permissions:
    contents: write
jobs:
    format:
        runs-on: ubuntu-latest
        if: ${{ !startsWith(github.event.head_commit.message, 'style:') }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: '21'
            - uses: gradle/actions/setup-gradle@v4
            - run: ./gradlew spotlessApply
            - name: Commit
              run: |
                  git config user.name "github-actions"
                  git config user.email "actions@users.noreply.github.com"
                  if [ -n "$(git status --porcelain)" ]; then
                      git add -A
                      git commit -m "style: spotlessApply"
                      git push
                  fi
