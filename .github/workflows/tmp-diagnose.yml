name: Temporary diagnose
on:
    push:
        branches: [feature/notes]
permissions:
    contents: read
jobs:
    diagnose:
        runs-on: ubuntu-latest
        if: ${{ startsWith(github.event.head_commit.message, 'diag:') }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: '21'
            - uses: gradle/actions/setup-gradle@v4
            - name: Build and collect errors
              run: |
                  ./gradlew build --continue > build.log 2>&1 || true
                  {
                      grep -E "^e: |What went wrong|Execution failed|FAILED|Unresolved|error:" build.log
                      find . -path '*/lint_intermediate_text_report/*' -name 'lint-results-*.txt' -exec grep -hE "Error:|Warning:|^[^ ].*\.kt:[0-9]+" {} +
                  } | sed 's#/home/runner/work/[^/]*/[^/]*/##' | awk '!seen[$0]++' | head -50 | while IFS= read -r line; do
                      echo "::error::${line:0:400}"
                  done
